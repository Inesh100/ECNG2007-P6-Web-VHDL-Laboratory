name: Deploy to GitHub Pages

# Builds the combined P6 app (repo root) and the P6B app (P6B/),
# then publishes both: root app at /, P6B at /P6B/.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build P6 app (root)
        run: |
          npm ci
          npx tsc -b
          npx vite build --base=./

      - name: Test and build P6B
        working-directory: P6B
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

      - name: Combine sites
        run: cp -r P6B/dist dist/P6B

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
