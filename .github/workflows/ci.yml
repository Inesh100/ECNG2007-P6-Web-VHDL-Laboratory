name: CI

on:
  push:
  pull_request:

jobs:
  app:
    name: P6 app (app/)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx oxlint
      - run: npm run build

  p6b:
    name: P6B (P6B/)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: P6B
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
